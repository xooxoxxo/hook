name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        xcode: [default, "16.4"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Select Swift 6.1 compatibility toolchain
        if: matrix.xcode == '16.4'
        run: |
          test -d /Applications/Xcode_16.4.app
          echo "DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer" >> "$GITHUB_ENV"

      - name: Verify compatibility Swift version
        if: matrix.xcode == '16.4'
        run: swift --version | grep -E 'Swift version 6\.1([ .]|$)'

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Shared core boundary
        run: ./scripts/test-check-core-boundary.sh && python3 scripts/check-core-boundary.py --include-ui

      - name: iOS shared core builds
        run: ./scripts/check-ios-core.sh

      - name: iOS shared UI builds
        run: ./scripts/check-ios-ui.sh

      - name: Token lint
        run: ./scripts/test-check-tokens.sh && ./scripts/check-tokens.sh

      - name: Gallery builds
        run: swift build --product RelayGallery

      - name: Swift tests (default concurrency)
        run: swift test --skip LoginShellTimingTests

      - name: Shell timing tests (dedicated process)
        run: swift test --skip-build --filter LoginShellTimingTests

      - name: Client tests
        run: python3 -m unittest discover -s clients -p 'test_*.py' -v

      - name: MCP tests
        run: python3 -m unittest discover -s mcp -p 'test_*.py' -v

      - name: Client and MCP tests on /usr/bin/python3
        run: |
          if [ -x /usr/bin/python3 ] && /usr/bin/python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 9) else 1)'; then
            /usr/bin/python3 -m unittest discover -s clients -p 'test_*.py' -v
            /usr/bin/python3 -m unittest discover -s mcp -p 'test_*.py' -v
          else
            echo "/usr/bin/python3 is missing or older than 3.9; skipped"
          fi

      - name: Installer tests
        run: ./scripts/test-install.sh && ./scripts/test-get.sh && ./scripts/test-package.sh && ./scripts/test-make-signing-cert.sh
