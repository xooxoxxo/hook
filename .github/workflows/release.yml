name: Release

# A tag prepares a signed, notarized DRAFT. Publication is a separate approved action.
# Required secrets: MACOS_SIGN_P12, MACOS_SIGN_PASSWORD, APPLE_API_KEY,
# APPLE_API_KEY_ID, APPLE_API_ISSUER_ID. Required repository variables:
# APPLE_TEAM_ID and MACOS_SIGN_SHA1 (the expected Developer ID Application fingerprint).

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Tag matches the version
        run: |
          version="$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
          case "$GITHUB_REF_NAME" in
            "v$version") ;;
            *) echo "::error::tag $GITHUB_REF_NAME does not match Resources/Info.plist ($version)"; exit 1 ;;
          esac
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Swift version
        run: swift --version

      - name: Release notes
        run: ./scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"

      - name: Packaging and installer tests
        run: ./scripts/test-package.sh && ./scripts/test-install.sh && ./scripts/test-get.sh

      - name: Required release signing
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_SIGN_SHA1: ${{ vars.MACOS_SIGN_SHA1 }}
        run: ./scripts/prepare-release-signing.sh

      - name: Build universal Hook.app
        run: UNIVERSAL=1 BUILD_ONLY=1 ./scripts/build.sh

      - name: Notarize and staple
        run: |
          ditto -c -k --keepParent build/Hook.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$NOTARY_KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --wait --output-format json > "$RUNNER_TEMP/notary-result.json"
          python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1])).get("status") == "Accepted" else "Notarization not accepted")' "$RUNNER_TEMP/notary-result.json"
          xcrun stapler staple build/Hook.app
          xcrun stapler validate build/Hook.app

      - name: Package
        run: RELEASE_TAG="$GITHUB_REF_NAME" ./scripts/package-release.sh --app build/Hook.app --out dist

      - name: Verify the final package
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: python3 scripts/verify-release.py --package dist --version "$VERSION" --team "$APPLE_TEAM_ID"

      - name: Create reviewable draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # No clobber or automatic publication. Existing tags/drafts require explicit recovery.
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
            --title "Hook $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            "dist/Hook-$VERSION.zip" dist/SHA256SUMS "$RUNNER_TEMP/notary-result.json"

      - name: Remove the signing keychain and key
        if: always()
        run: |
          if [ -n "${SIGN_KEYCHAIN:-}" ]; then security delete-keychain "$SIGN_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/signing.p12"
