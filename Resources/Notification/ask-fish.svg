</g>
<g clip-path="url(#tile)">
<g transform="translate(8.8 5) scale(2.9)" stroke-linejoin="round" stroke-linecap="round">
  <path d="M 0.6 22 L 0.6 18 C 0.6 12.4 2.8 7.6 6.0 6.4 L 10.0 6.4 C 13.2 7.6 15.4 12.4 15.4 18 L 15.4 22 L 0.6 22 Z" transform="translate(0 -0.6)"
