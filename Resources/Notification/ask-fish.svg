<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- The fish on the hook (Resources/MenuBar/menubar-new.svg) in the app icon's colours, for the
     thumbnail on a new-ask notification. scripts/menubar-glyphs.sh renders it to PNG. -->
<defs>
  <radialGradient id="sky" cx="32" cy="30" r="44" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#f302a2"/><stop offset="0.55" stop-color="#b303a4"/><stop offset="1" stop-color="#290076"/>
  </radialGradient>
  <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f9f9fb"/><stop offset="0.55" stop-color="#c9cbe0"/><stop offset="1" stop-color="#6d63ad"/>
  </linearGradient>
  <linearGradient id="lime" x1="0" y1="0" x2="0.4" y2="1">
    <stop offset="0" stop-color="#d5f501"/><stop offset="1" stop-color="#5cce03"/>
  </linearGradient>
  <clipPath id="tile"><rect width="64" height="64" rx="14"/></clipPath>
  <mask id="face"><rect x="-2" y="-4" width="20" height="28" fill="#fff"/><circle cx="8" cy="4.3" r="3.2" fill="#000"/></mask>
</defs>
