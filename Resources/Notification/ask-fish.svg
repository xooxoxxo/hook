  <circle cx="4.6" cy="10.8" r="1.9" fill="#fff" stroke="#1c1600" stroke-width="0.4"/>
  <circle cx="11.4" cy="10.8" r="1.9" fill="#fff" stroke="#1c1600" stroke-width="0.4"/>
  <circle cx="4.9" cy="10.5" r="0.95" fill="#1c1600"/><circle cx="11.1" cy="10.5" r="0.95" fill="#1c1600"/>
  <path d="M 5.4 7.6 Q 8 9.9 10.6 7.6" stroke="#1c1600" stroke-width="0.75" fill="none"/>
  <path d="M 8 -2 L 8 2.4" stroke="#1c1600" stroke-width="2.2"/>
